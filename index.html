<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Blind Feed">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Blind Feed</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
html,body{margin:0;height:100%;background:#000;color:#fff;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
#feed{position:fixed;inset:0;overflow:hidden;background:#000}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;transform:translateY(100%);will-change:transform;pointer-events:none}
#v0{transform:none}
#menuBtn{position:fixed;z-index:5;top:calc(env(safe-area-inset-top,0px) + 6px);right:calc(env(safe-area-inset-right,0px) + 8px);width:44px;height:44px;border:0;border-radius:22px;background:rgba(0,0,0,.35);color:#fff;font-size:24px;line-height:1;opacity:.75}
#menu{position:fixed;inset:0;z-index:10;background:#000;display:none;flex-direction:column;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#menu.open{display:flex}
.head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
.head b{font-size:20px}
button,.btn{font:inherit;color:#fff;background:#262626;border:0;border-radius:10px;padding:11px 16px;display:inline-block}
.row2{display:flex;gap:10px;padding:0 16px 8px}
.row2>*{flex:1;text-align:center}
#info{padding:4px 16px 10px;font-size:13px;color:#999;line-height:1.5}
#list{flex:1;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;padding:0 16px 16px}
.it{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid #1c1c1c}
.it img,.it .ph{width:45px;height:80px;object-fit:cover;border-radius:6px;background:#1a1a1a;flex:none}
.it span{flex:1;font-size:14px;color:#bbb}
.it button{background:#3a1414;color:#ff6b6b;padding:8px 14px}
#empty{padding:40px 16px;color:#888;text-align:center}
#toast{position:fixed;z-index:20;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);background:#333;border-radius:10px;padding:12px 14px;font-size:14px;text-align:center;display:none}
</style></head>
<body>
<div id="feed">
  <video id="v0" playsinline webkit-playsinline muted preload="auto"></video>
  <video id="v1" playsinline webkit-playsinline muted preload="auto"></video>
</div>
<button id="menuBtn" aria-label="メニュー">⋯</button>
<div id="menu">
  <div class="head"><b id="count">0本</b><button id="closeBtn">閉じる</button></div>
  <div class="row2">
    <label class="btn">動画を追加<input id="file" type="file" accept="video/*" multiple hidden></label>
    <button id="shuffleBtn">シャッフル</button>
  </div>
  <div id="info"></div>
  <div id="list"></div>
</div>
<div id="toast"></div>
<script>
'use strict';
const $ = s => document.querySelector(s);
const feed = $('#feed'), menu = $('#menu'), vs = [$('#v0'), $('#v1')];
let db, ids = [], order = [], idx = 0, c = 0, busy = false, changed = false, unlocked = false;

/* ---------- IndexedDB ---------- */
const openDB = () => new Promise((res, rej) => {
  const r = indexedDB.open('blindfeed', 1);
  r.onupgradeneeded = () => {
    r.result.createObjectStore('videos', {keyPath: 'id', autoIncrement: true});
    r.result.createObjectStore('meta', {keyPath: 'id'});
  };
  r.onsuccess = () => res(r.result);
  r.onerror = () => rej(r.error);
});
const req = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const txDone = tx => new Promise((res, rej) => { tx.oncomplete = res; tx.onerror = tx.onabort = () => rej(tx.error); });
const getMetas = async () => (await req(db.transaction('meta').objectStore('meta').getAll())).sort((a, b) => a.id - b.id);
const blobCache = new Map();
const getBlob = async id => {
  if (blobCache.has(id)) { const b = blobCache.get(id); blobCache.delete(id); blobCache.set(id, b); return b; }
  const r = await req(db.transaction('videos').objectStore('videos').get(id)), b = r && r.blob;
  if (b) { blobCache.set(id, b); while (blobCache.size > 5) blobCache.delete(blobCache.keys().next().value); }
  return b;
};

/* ---------- util ---------- */
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const mb = n => (n / 1048576).toFixed(n > 1e8 ? 0 : 1) + 'MB';
let tt; const toast = (m, ms = 3500) => { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(tt); tt = setTimeout(() => t.style.display = 'none', ms); };
const errMsg = e => e && e.name === 'QuotaExceededError' ? '保存容量が不足しています。不要な動画を削除してください。' : '保存に失敗しました: ' + ((e && (e.message || e.name)) || '不明なエラー');

/* ---------- player ---------- */
function ensure(el, i) {
  const id = order[i];
  if (el.dataset.id == id) return el.p;
  el.dataset.id = id;
  el.p = (async () => {
    const b = await getBlob(id);
    if (el.dataset.id != id) return;
    if (el.u) URL.revokeObjectURL(el.u);
    el.u = b ? URL.createObjectURL(b) : '';
    if (b) { el.src = el.u; el.load(); }
  })();
  return el.p;
}
function extend() {
  const last = order[order.length - 1], r = shuffle(ids.slice());
  if (r.length > 1 && r[0] === last) [r[0], r[1]] = [r[1], r[0]];
  order.push(...r);
}
function preloadNext() {
  if (!order.length) return;
  if (idx + 1 >= order.length) extend();
  ensure(vs[1 - c], idx + 1);
  if (idx > 0) getBlob(order[idx - 1]).catch(() => {});
  if (idx + 2 < order.length) getBlob(order[idx + 2]).catch(() => {});
}
let soundOn = false;
function play(v) {
  v.muted = !soundOn;
  const p = v.play();
  if (p && p.catch) p.catch(() => { v.muted = true; v.play().catch(() => {}); });
}
async function startSession() {
  busy = true;
  blobCache.clear();
  ids = (await getMetas()).map(m => m.id);
  vs.forEach(v => { v.pause(); v.style.transition = 'none'; });
  vs[0].style.transform = 'translateY(0)'; vs[1].style.transform = 'translateY(100%)';
  c = 0; idx = 0;
  vs.forEach(v => { delete v.dataset.id; v.removeAttribute('src'); if (v.u) { URL.revokeObjectURL(v.u); v.u = ''; } });
  if (!ids.length) { order = []; busy = false; openMenu(); return; }
  order = shuffle(ids.slice());
  await ensure(vs[0], 0);
  vs[0].currentTime = 0;
  busy = false;
  if (!menu.classList.contains('open')) play(vs[0]);
  preloadNext();
}
let animSp = null;
async function go(d) {
  if (busy || !order.length || menu.classList.contains('open')) return;
  const ni = idx + d;
  if (ni < 0) return;
  busy = true;
  const sp = vs[1 - c];
  await ensure(sp, ni);
  sp.currentTime = 0;
  sp.style.transition = 'none';
  sp.style.transform = 'translateY(' + d * 100 + '%)';
  sp.offsetHeight;
  commit(d, ni);
}
function commit(d, ni) {
  const cur = vs[c], sp = vs[1 - c];
  animSp = sp;
  sp.currentTime = 0;
  cur.style.transition = sp.style.transition = 'transform .18s cubic-bezier(.2,.9,.3,1)';
  cur.style.transform = 'translateY(' + -d * 100 + '%)';
  sp.style.transform = 'translateY(0)';
  play(sp);
  if (sp.p) sp.p.then(() => { if (sp.paused && sp === vs[c] || sp.paused && animSp === sp) play(sp); });
  setTimeout(() => { cur.pause(); c = 1 - c; idx = ni; busy = false; animSp = null; preloadNext(); }, 190);
}
function snapBack(r) {
  busy = true;
  const cur = vs[c], sp = r.sp;
  cur.style.transition = sp.style.transition = 'transform .18s cubic-bezier(.25,.8,.3,1)';
  cur.style.transform = 'translateY(0)';
  sp.style.transform = 'translateY(' + r.dir * 100 + '%)';
  setTimeout(() => { busy = false; }, 190);
}
vs.forEach(v => v.addEventListener('ended', () => { if (v === vs[c]) go(1); }));

function unlock(prime) {
  const first = !soundOn;
  soundOn = true;
  vs[c].muted = false;
  if (first) {
    vs.forEach(v => {
      v.muted = false;
      if (prime && v !== vs[c] && v !== animSp && v.src) {
        const p = v.play();
        if (p && p.then) p.then(() => { if (v !== vs[c] && v !== animSp) v.pause(); }).catch(() => {});
      }
    });
  }
  if (vs[c].paused && !busy && !menu.classList.contains('open')) play(vs[c]);
}

/* ---------- gestures: 指に追従 ---------- */
let dr = null;
feed.addEventListener('touchstart', e => {
  if (busy) { dr = null; return; }
  const t = e.touches[0];
  dr = {x: t.clientX, y: t.clientY, t: Date.now(), dir: 0, d: 0, blocked: false, sp: null};
}, {passive: true});
feed.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!dr || busy || dr.blocked) return;
  const t = e.touches[0], dy = t.clientY - dr.y, dx = t.clientX - dr.x;
  if (!dr.dir) {
    if (Math.abs(dy) < 3 || Math.abs(dy) < Math.abs(dx)) return;
    const d = dy < 0 ? 1 : -1;
    if (idx + d < 0) { dr.blocked = true; return; }
    dr.dir = d; dr.sp = vs[1 - c];
    ensure(dr.sp, idx + d);
    vs.forEach(v => v.style.transition = 'none');
  }
  const d = dr.dir > 0 ? Math.min(0, dy) : Math.max(0, dy);
  dr.d = d;
  vs[c].style.transform = 'translateY(' + d + 'px)';
  dr.sp.style.transform = 'translateY(calc(' + dr.dir * 100 + '% + ' + d + 'px))';
}, {passive: false});
feed.addEventListener('touchend', e => {
  const r = dr; dr = null;
  unlock(!(r && r.dir));
  if (r && r.dir && !busy) {
    const H = window.innerHeight, dt = Math.max(1, Date.now() - r.t), v = Math.abs(r.d) / dt;
    if (Math.abs(r.d) > H * 0.1 || (v > 0.15 && Math.abs(r.d) > 12)) { busy = true; commit(r.dir, idx + r.dir); }
    else snapBack(r);
  } else if (r && !r.dir && !r.blocked && !busy) {
    const t = e.changedTouches[0];
    if (Math.abs(t.clientX - r.x) < 10 && Math.abs(t.clientY - r.y) < 10) { const v = vs[c]; v.paused ? play(v) : v.pause(); }
  }
});
feed.addEventListener('touchcancel', () => { const r = dr; dr = null; if (r && r.dir && !busy) snapBack(r); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) vs[c].pause();
  else if (order.length && !menu.classList.contains('open')) play(vs[c]);
});

/* ---------- menu ---------- */
async function openMenu() { vs[c].pause(); menu.classList.add('open'); await renderList(); }
async function closeMenu() {
  menu.classList.remove('open');
  if (changed) { changed = false; await startSession(); }
  else if (order.length) play(vs[c]);
}
async function renderList() {
  const metas = await getMetas(), total = metas.reduce((s, m) => s + (m.size || 0), 0);
  $('#count').textContent = metas.length + '本';
  const list = $('#list'); list.textContent = '';
  if (!metas.length) { const d = document.createElement('div'); d.id = 'empty'; d.textContent = '「動画を追加」から写真・ファイルの動画を選んでください'; list.append(d); }
  metas.forEach((m, i) => {
    const row = document.createElement('div'); row.className = 'it';
    let th; if (m.thumb) { th = document.createElement('img'); th.src = m.thumb; } else { th = document.createElement('div'); th.className = 'ph'; }
    const sp = document.createElement('span'); sp.textContent = '#' + (i + 1) + '  ' + mb(m.size || 0);
    const b = document.createElement('button'); b.textContent = '削除';
    b.onclick = async () => {
      if (!confirm('この動画を削除しますか？\n（元に戻せません）')) return;
      try {
        const tx = db.transaction(['videos', 'meta'], 'readwrite');
        tx.objectStore('videos').delete(m.id); tx.objectStore('meta').delete(m.id);
        await txDone(tx); changed = true; renderList();
      } catch (e) { toast('削除に失敗しました: ' + (e.message || e.name)); }
    };
    row.append(th, sp, b); list.append(row);
  });
  let s = '登録動画の合計 ' + mb(total);
  try {
    if (navigator.storage && navigator.storage.estimate) {
      const e = await navigator.storage.estimate();
      s += '\n端末内の使用量 ' + mb(e.usage || 0) + ' / 利用可能の目安 ' + mb(e.quota || 0);
    }
    if (navigator.storage && navigator.storage.persisted) s += '\n永続ストレージ: ' + (await navigator.storage.persisted() ? '有効' : '未許可');
  } catch (e) {}
  $('#info').style.whiteSpace = 'pre-line'; $('#info').textContent = s;
}
function makeThumb(file) {
  return new Promise(res => {
    const v = document.createElement('video'), u = URL.createObjectURL(file);
    v.muted = true; v.playsInline = true; v.preload = 'auto';
    const fin = t => { URL.revokeObjectURL(u); v.removeAttribute('src'); v.load(); res(t); };
    setTimeout(() => fin(''), 6000);
    v.onloadeddata = () => { v.currentTime = Math.min(0.1, (v.duration || 0) / 2); };
    v.onseeked = () => {
      try {
        const h = 160, w = Math.round(h * v.videoWidth / v.videoHeight) || 90, cv = document.createElement('canvas');
        cv.width = w; cv.height = h; cv.getContext('2d').drawImage(v, 0, 0, w, h); fin(cv.toDataURL('image/jpeg', .6));
      } catch (e) { fin(''); }
    };
    v.onerror = () => fin('');
    v.src = u;
  });
}
$('#file').addEventListener('change', async e => {
  const files = [...e.target.files]; e.target.value = '';
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  let ok = 0;
  for (let i = 0; i < files.length; i++) {
    const f = files[i]; toast('追加中 ' + (i + 1) + ' / ' + files.length, 60000);
    try {
      const thumb = await makeThumb(f);
      const blob = f.slice(0, f.size, f.type || 'video/mp4');
      const tx = db.transaction(['videos', 'meta'], 'readwrite');
      const id = await req(tx.objectStore('videos').add({blob}));
      tx.objectStore('meta').put({id, thumb, size: f.size});
      await txDone(tx); ok++; changed = true;
    } catch (err) { toast(errMsg(err), 6000); break; }
  }
  if (ok === files.length) toast(ok + '本を追加しました');
  renderList();
});
$('#menuBtn').addEventListener('click', openMenu);
$('#closeBtn').addEventListener('click', closeMenu);
$('#shuffleBtn').addEventListener('click', async () => { changed = false; menu.classList.remove('open'); await startSession(); toast('シャッフルしました', 1500); });

/* ---------- boot ---------- */
(async () => {
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  try { db = await openDB(); } catch (e) { toast('保存領域を開けません: ' + (e.message || e.name), 8000); return; }
  startSession();
})();
</script>
</body></html>
